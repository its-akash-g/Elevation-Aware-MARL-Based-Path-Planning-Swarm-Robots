rover_1/controller_manager:
  ros__parameters:
    update_rate: 50
    diff_cont:
      type: diff_drive_controller/DiffDriveController
    joint_broad:
      type: joint_state_broadcaster/JointStateBroadcaster

rover_2/controller_manager:
  ros__parameters:
    update_rate: 50
    diff_cont:
      type: diff_drive_controller/DiffDriveController
    joint_broad:
      type: joint_state_broadcaster/JointStateBroadcaster

rover_3/controller_manager:
  ros__parameters:
    update_rate: 50
    diff_cont:
      type: diff_drive_controller/DiffDriveController
    joint_broad:
      type: joint_state_broadcaster/JointStateBroadcaster

rover_1/diff_cont:
  ros__parameters:
    publish_rate: 50.0
    base_frame_id: rover_1/base_link
    odom_frame_id: rover_1/odom
    left_wheel_names: ['left_wheel_joint']
    right_wheel_names: ['right_wheel_joint']
    wheel_separation: 0.35
    wheel_radius: 0.05
    use_stamped_vel: false

